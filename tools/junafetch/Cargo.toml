[package]
name = "junafetch"
version = "0.3.0"
edition = "2021"
rust-version = "1.97"

[dependencies]
# Requirement: consume the pinned detector's bounded structured report without passing raw JSON to the terminal.
serde_json = "=1.0.151"
# Standards data only: wrap public Unicode hardware/font names without splitting clusters or overflowing columns.
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.3"

[target.'cfg(windows)'.dependencies]
# Requirements: native SHA-256 verification of the extracted payload and console geometry for width-aware output.
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }
