[package]
name = "junafetch"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"

[dependencies]
# Requirement: consume the pinned detector's bounded structured report without passing raw JSON to the terminal.
serde_json = "=1.0.151"

[target.'cfg(windows)'.dependencies]
# Requirements: native SHA-256 verification of the extracted payload and console geometry for width-aware output.
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console"] }
