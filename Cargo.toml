[package]
name = "smith"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "A native Windows terminal emulator with an original VT engine"

[dependencies]
winit = "0.30"
wgpu = { version = "29", default-features = false, features = [
    "std",
    "dx12",
    "vulkan",
    "gles",
    "wgsl",
] }
conpty-oxide = "0.1.2"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
swash = "0.2"
fontdb = "0.23"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Gdi",
] }