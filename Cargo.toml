[package]
name = "juna"
version = "0.1.1-dev1"
edition = "2021"
rust-version = "1.97"
description = "A terminal emulator with an original VT engine"

[dependencies]
winit = "0.30"
wgpu = { version = "29", default-features = false, features = [
    "std",
    "dx12",
    "vulkan",
    "gles",
    "wgsl",
] }
log = "0.4"
env_logger = "0.11"
unicode-width = "=0.2.2"
unicode-segmentation = "=1.13.3"
# Approved THEME_DESIGN: typed, versioned custom-theme and settings JSON.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# D6 decision: the pure-Rust rasterisation stack is the primary backend.
# fontdb discovers system fonts; swash shapes clusters and rasterises glyphs.
# Both are C-free runtime infrastructure behind Juna's renderer API.
fontdb = "0.23"
swash = "0.2"
# Needed for Pod/ZeroSafe casts between Rust structs and GPU buffers.
# Already present transitively via wgpu, so this costs no additional compile.
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]

# Windows-only platform access: parent console attachment, Unicode clipboard
# ownership/memory, and visible failure dialogs. No child token/elevation API.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    # Give Juna its own taskbar group rather than inheriting launcher identity.
    "Win32_UI_Shell",
    # Explicit window relaunch/icon properties prevent stale generic taskbar groups.
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # Approved portable-settings transfer: native file dialogs on an I/O worker.
    "Win32_UI_Controls_Dialogs",
]

# Windows-only. conpty-oxide carries `compile_error!` under `cfg(not(windows))`,
# so depending on it unconditionally is a hard compile error on every other
# target. It is referenced only from src/session/windows.rs, which is itself
# cfg(windows).
#
# A Unix PTY backend will be a separate implementation behind the same session
# seam -- see ARCHITECTURE.md 3.9.
[target.'cfg(windows)'.dependencies]
conpty-oxide = "=0.1.2"

[target.'cfg(windows)'.dev-dependencies]
conpty-oxide = "=0.1.2"
