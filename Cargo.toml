[package]
name = "juna"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "A terminal emulator with an original VT engine"

[dependencies]
winit = "0.30"
wgpu = { version = "29", default-features = false, features = [
    "std",
    "dx12",
    "vulkan",
    "gles",
    "wgsl",
] }
log = "0.4"
env_logger = "0.11"
winres = { version = "0.1.12", optional = true }

# D6 decision: the pure-Rust rasterisation stack is the primary backend.
# fontdb discovers system fonts, swash+zeno rasterises. Both are C-free and
# currently sit in the tree as dev-dependencies for `examples/font_spike.rs`;
# the renderer needs them at runtime, so they are declared here.
fontdb = "0.23"
swash = "0.2"
# Needed for Pod/ZeroSafe casts between Rust structs and GPU buffers.
# Already present transitively via wgpu, so this costs no additional compile.
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]

# Windows-only, and used for exactly one call: AttachConsole, so a GUI-subsystem
# binary launched from a terminal still writes diagnostics there instead of
# growing its own console window. Feature is pinned to that one module.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Console",
]

# Windows-only. conpty-oxide carries `compile_error!` under `cfg(not(windows))`,
# so depending on it unconditionally is a hard compile error on every other
# target. It is referenced only from src/session/windows.rs, which is itself
# cfg(windows).
#
# A Unix PTY backend will be a separate implementation behind the same session
# seam -- see ARCHITECTURE.md 3.9.
[target.'cfg(windows)'.dependencies]
conpty-oxide = "0.1.2"

[target.'cfg(windows)'.dev-dependencies]
conpty-oxide = "0.1.2"
